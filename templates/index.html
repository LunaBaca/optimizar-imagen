<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimización de Imágenes con Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md overflow-hidden p-6 border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Optimizar Imagen</h2>

        <!-- Mensajes Flash de Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 mb-4 text-sm rounded-lg {% if category == 'exito' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Errores de Validación JavaScript -->
        <div id="errorContainer" class="mb-4"></div>

        <form id="uploadForm" action="/" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">Título o Descripción:</label>
                <input type="text" id="titulo" name="titulo" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label for="imagen" class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Imagen:</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required
                       class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200">
                Procesar y Convertir a WebP
            </button>
        </form>

        <!-- Resultado procesado -->
        {% if imagen_procesada %}
            <div class="mt-6 pt-6 border-t border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Resultado:</h3>
                <p class="text-xs text-gray-500 mb-3">Convertida exitosamente a formato WebP optimizado.</p>
                <div class="rounded-lg overflow-hidden border border-gray-300 shadow-sm">
                    <img src="{{ url_for('static', filename='uploads/' + imagen_procesada) }}" 
                         alt="Imagen Optimizada" 
                         class="w-full h-auto object-cover">
                </div>
            </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
